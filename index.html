<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para mi Changuita 🌻</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body class="pagina">


    <!-- =========================================
         TRANSICIÓN ENTRE PÁGINAS
    ========================================== -->

    <div class="transicion-pagina"></div>


    <!-- =========================================
         PÉTALOS
    ========================================== -->

    <div id="petalos"></div>


    <!-- =========================================
         PORTADA
    ========================================== -->

    <main class="hero">

        <div class="luz"></div>


        <!-- Flores decorativas -->

        <img src="img/flores/girasol.png" class="flor-decorativa flor-1" alt="">

        <img src="img/flores/margarita.png" class="flor-decorativa flor-2" alt="">

        <img src="img/flores/girasol2.png" class="flor-decorativa flor-3" alt="">

        <img src="img/flores/rosaamarilla (1).png" class="flor-decorativa flor-4" alt="">


        <!-- =====================================
             CONTENIDO PRINCIPAL
        ====================================== -->

        <div class="hero-contenido">

            <p class="hero-pequeno">
                Para alguien muy especial
            </p>


            <h1>
                Hola Changuita
            </h1>


            


            <div class="linea-dorada"></div>


            <p class="hero-frase">

                Hay flores que buscan el sol...
                <br>

                y hay personas que se convierten
                <br>

                en nuestra luz.

            </p>


            <button id="btnAbrir" class="btn-regalo">
                

                🌻 Abrir mi regalo 🌻

            </button>

        </div>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
