<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Estrellita ✨</title>

    <link rel="stylesheet" href="css/style.css">
</head>


<body class="pagina">

    <!-- =====================================================
         TRANSICIÓN ENTRE PÁGINAS
    ====================================================== -->

    <div class="transicion-pagina"></div>


    <!-- =====================================================
         GRAN JARDÍN FINAL
    ====================================================== -->

    <main class="gran-jardin">


        <!-- =================================================
             LUZ DEL ATARDECER
        ================================================== -->

        <div class="jardin-atardecer"></div>


        <!-- =================================================
             DESTELLOS
        ================================================== -->

        <div class="destellos">

            <span class="destello destello-1">✦</span>

            <span class="destello destello-2">✧</span>

            <span class="destello destello-3">✦</span>

            <span class="destello destello-4">✧</span>

            <span class="destello destello-5">✦</span>

            <span class="destello destello-6">✧</span>

            <span class="destello destello-7">✦</span>

            <span class="destello destello-8">✧</span>

        </div>


        <!-- =================================================
             RAMOS DECORATIVOS
        ================================================== -->

        <div class="ramos">

            <img src="img/flores/ramo1.png" class="ramo ramo-1" alt="">

            <img src="img/flores/ramo2.png" class="ramo ramo-2" alt="">

            <img src="img/flores/ramo1.png" class="ramo ramo-3" alt="">

            <img src="img/flores/ramo2.png" class="ramo ramo-4" alt="">

        </div>


        <!-- =================================================
             ABEJAS
        ================================================== -->

        <div class="enjambre">

            <img src="img/flores/abeja1.png" class="abeja abeja-1" alt="">

            <img src="img/flores/abeja2.png" class="abeja abeja-2" alt="">

            <img src="img/flores/abeja1.png" class="abeja abeja-3" alt="">

            <img src="img/flores/abeja2.png" class="abeja abeja-4" alt="">

            <img src="img/flores/abeja1.png" class="abeja abeja-5" alt="">

            <img src="img/flores/abeja2.png" class="abeja abeja-6" alt="">

        </div>


        <div class="gran-jardin-contenido">

            <p class="jardin-final">
                Y así, poquito a poquito...
            </p>

            <div class="jardin-linea"></div>

            <h1>
                Mi Estrellita ✨
            </h1>

            <p class="gran-jardin-texto">
                Un pequeño jardín para alguien muy especial.
                <br>
                
            </p>

            <div class="flores-centro">
                <span>🌻</span>
                <span>🌼</span>
                <span>🌻</span>
            </div>

            <p class="gran-jardin-dedicatoria">
                Para ti, Changuita. 💛
            </p>

            <div class="sorpresa-final">

                <p>
                    Y aún queda una última sorpresa...
                </p>

                <button id="btnFlores" class="btn-flores" type="button">
                    🌻 Oprime el botón :3 🌻
                </button>

            </div>

        </div>


        </div>


        <!-- =================================================
             PIE
        ================================================== -->

        <div class="gran-jardin-pie">

            <span>✨</span>

            <span>Con amor, Oskar</span>

            <span>✨</span>

        </div>


    </main>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="js/script.js"></script>

</body>

</html>
